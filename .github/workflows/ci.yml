name: CI Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: zervuno_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/zervuno_test
          SECRET_KEY: ci-test-secret-key-12345678901234567890
        run: |
          alembic upgrade head

      - name: Run Pytest Suite
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/zervuno_test
          SECRET_KEY: ci-test-secret-key-12345678901234567890
          ENVIRONMENT: test
        run: |
          pytest -v

  frontend-check:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest Suite
        working-directory: ./frontend
        run: npm test

      - name: Build Production Assets (TypeCheck + Vite)
        working-directory: ./frontend
        run: npm run build
